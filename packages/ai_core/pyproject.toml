[project]
name = "learntrail-ai-core"
version = "0.1.0"
description = "LearnTrail AI application layer: gateway client, schemas, graphs. Middle of docs/SPEC.md §16."
readme = "../../README.md"
requires-python = ">=3.12"
dependencies = [
    # The OpenAI SDK is used here as an HTTP client for an *OpenAI-compatible
    # endpoint*, not as a commitment to OpenAI. It points at the LiteLLM proxy,
    # which speaks that wire format regardless of which provider sits behind an
    # alias — swapping the provider is still a one-line edit in
    # infra/litellm/config.yaml, and nothing in this package changes.
    #
    # docs/CODE_QUALITY.md's `model-call-bypasses-litellm-gateway` Semgrep rule
    # forbids `import openai` everywhere except ai_core/models/gateway.py, which
    # is the only module here that imports it.
    "openai>=1.60",
    "pydantic>=2.12.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_core"]
