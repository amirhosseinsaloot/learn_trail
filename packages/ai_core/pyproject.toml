[project]
name = "learntrail-ai-core"
version = "0.1.0"
description = "LearnTrail AI application layer: gateway client, schemas, graphs. Middle of docs/SPEC.md §16."
requires-python = ">=3.12"
dependencies = [
    "guardrails-ai>=0.10",
    "langchain-core>=0.3",
    "langgraph>=0.3",
    # The OpenAI SDK is used here as an HTTP client for an *OpenAI-compatible
    # endpoint*, not as a commitment to OpenAI. It points at the LiteLLM proxy,
    # which speaks that wire format regardless of which provider sits behind an
    # alias — swapping the provider is still a one-line edit in
    # infra/litellm/config.yaml, and nothing in this package changes.
    #
    # docs/CODE_QUALITY.md's `model-call-bypasses-litellm-gateway` Semgrep rule
    # forbids `import openai` everywhere except ai_core/models/gateway.py, which
    # is the only module here that imports it.
    "langgraph-checkpoint-postgres>=2.0",
    # LlamaIndex, for chunking and node metadata only (Phase 8, docs/SPEC.md §7).
    # `llama-index-core` rather than the `llama-index` metapackage: the latter
    # pulls readers, agents and a dozen integrations this project has no use for,
    # and every one of them is a dependency to audit.
    #
    # Its vector store and query engine are deliberately NOT used. Storage is
    # SQLAlchemy + pgvector like every other table, so `packages/database` stays
    # the single owner of schema and Alembic stays the single owner of migrations
    # — LlamaIndex's store creates and alters its own tables, which would put two
    # things in charge of the same database.
    "llama-index-core>=0.14",
    "nemoguardrails>=0.23",
    "openai>=1.60",
    # Tracing (Phase 5, docs/SPEC.md §11). The SDK and the OTLP exporter, and
    # deliberately nothing that names the backend — see
    # docs/decisions/0002-no-otel-collector.md. Swapping Phoenix for Langfuse or
    # Jaeger is an environment variable, not a dependency change.
    "opentelemetry-api>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-sdk>=1.44",
    # OpenInference is the LLM-specific *semantic convention* layer: it is what
    # makes a span carry prompts, completions and token counts in the shape a
    # trace viewer understands, rather than as ad-hoc attribute names only this
    # repo knows. Vendor-neutral in the same sense the OTel SDK is — Langfuse and
    # Jaeger read these conventions too.
    "openinference-instrumentation>=0.1.30",
    "pydantic>=2.12.4",
    "pydantic-ai-slim[openai]>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_core"]
