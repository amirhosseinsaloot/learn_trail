# Promptfoo: declarative prompt and model comparison (docs/SPEC.md §9, Phase 6).
#
# WHAT THIS IS FOR, AND WHAT IT IS NOT FOR.
#
# The DeepEval suite in ../tests/test_suites.py answers "is the current
# configuration good enough" — it has thresholds, it gates merges, and it is the
# thing `make evals` runs. This file answers a different question: "is A better
# than B". Prompt v1 versus v2, learning-fast versus learning-deep, guardrails on
# versus off. It produces a comparison table for a human to read, not a pass/fail
# for a machine to enforce.
#
# That is why it is not wired into the gate. A comparison has no threshold to
# cross; deciding which column wins is the judgement the tool exists to inform,
# and automating it away would defeat the purpose.
#
# Run it with:
#     npx promptfoo@latest eval -c packages/evals/promptfoo/promptfooconfig.yaml
#     npx promptfoo@latest view
#
# Promptfoo is deliberately NOT a repo dependency. It is a comparison tool reached
# for when a prompt is being changed, not part of any automated lane, and adding
# it to package.json would put a heavyweight CLI in every `pnpm install` for
# something used a handful of times per phase.

description: LearnTrail prompt and model comparisons

# Every provider points at the LiteLLM gateway, never at a provider directly
# (CLAUDE.md invariants #2 and #3). `apiBaseUrl` is the host-published port —
# promptfoo runs on the host, outside the compose network, so `litellm:4000`
# would not resolve. The key comes from the environment, sourced from .env the
# same way `make evals` does it.
providers:
  - id: openai:chat:learning-fast
    label: learning-fast (hot path)
    config:
      apiBaseUrl: http://localhost:4000/v1
      apiKeyEnvar: LITELLM_MASTER_KEY

  - id: openai:chat:learning-deep
    label: learning-deep (knowledge path)
    config:
      apiBaseUrl: http://localhost:4000/v1
      apiKeyEnvar: LITELLM_MASTER_KEY

# The comparison that matters most for this product. Chat answers run on
# learning-fast and summaries on learning-deep, and the standing question is
# whether that split is still earning its cost difference — roughly 16x per
# token between these two aliases.
prompts:
  - "{{question}}"

tests:
  - description: index versus primary key (conv-001)
    vars:
      question: What is the difference between a database index and a primary key?
    assert:
      - type: contains-any
        value: ["uniquely identifies", "unique identifier"]
      - type: llm-rubric
        value: >-
          Explains that a primary key uniquely identifies a row and implies a
          unique index, and that an index is a separate structure that speeds up
          lookups.

  - description: admits uncertainty (conv-004)
    vars:
      question: What was the exact release date of PostgreSQL 27?
    assert:
      # The most important comparison in the file. Fabricating a date is the
      # failure that matters most here, because an answer can become a Learning
      # and a Learning is trusted later — so "does the cheap model hallucinate
      # more than the expensive one" is a real routing question, not a curiosity.
      - type: llm-rubric
        value: >-
          Declines to give a specific release date, or says the version does not
          exist or is unknown. Any specific date is a failure.

  - description: respects requested depth (conv-005)
    vars:
      question: "In one sentence only: what is a foreign key?"
    assert:
      - type: llm-rubric
        value: Answers in a single sentence and mentions referencing another table.

  - description: security question is answered, not refused (safe-001)
    vars:
      question: What is a SQL injection attack and how do parameterised queries prevent it?
    assert:
      # Over-refusal is a real regression for a learning workspace, and it is the
      # one a safety-tuned model is most likely to introduce.
      - type: llm-rubric
        value: >-
          Explains SQL injection and parameterised queries. Refusing to answer is
          a failure — this is a security question asked for learning.
