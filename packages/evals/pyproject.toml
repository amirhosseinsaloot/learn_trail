[project]
name = "learntrail-evals"
version = "0.1.0"
description = "LearnTrail evaluation suite: golden datasets, metrics, and the merge gate. docs/SPEC.md §9-10."
readme = "../../README.md"
requires-python = ">=3.12"
dependencies = [
    # The suite scores real answers, so it needs the graphs and the gateway that
    # produce them. `evals` sits *above* the application and is imported by
    # nothing in it — the dependency runs one way only, which is what keeps the
    # thing being measured independent of the thing measuring it.
    "learntrail-ai-core",
    "learntrail-database",
    "pydantic>=2.12.4",
]

[project.optional-dependencies]
# DeepEval is heavy (it pulls a test framework, its own telemetry and a stack of
# transitive pins) and is only needed to *run* the suite. The merge gate, the
# datasets and the phase test import none of it, so a clean checkout can enforce
# the criterion without installing it.
judges = ["deepeval>=4.1,<5"]

# NO `retrieval` extra, though docs/SPEC.md §9 names Ragas. ragas 0.4.3 cannot be
# imported here at all — see the long note in evals/retrieval_eval.py. Shipping an
# extra that installs a package nothing can import would be worse than not having
# one: it would look like the capability was available.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals"]
