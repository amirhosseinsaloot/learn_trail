[project]
name = "learntrail-database"
version = "0.1.0"
description = "LearnTrail persistence layer: SQLAlchemy metadata + Alembic migration env. Part of docs/SPEC.md §16."
readme = "../../README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    # Driver choice: psycopg 3 (binary wheel), NOT asyncpg + psycopg2.
    # docs/SPEC.md §6 pairs an async FastAPI app with Alembic migrations, and
    # psycopg 3 is the only mainstream Postgres driver that serves both from one
    # dependency: `postgresql+psycopg://` is a sync SQLAlchemy dialect for the
    # migration runner and an async one for request-path sessions. asyncpg can
    # also drive migrations (Alembic ships an async env template that bridges via
    # `connection.run_sync`), so this is not a capability argument — it is one
    # driver and a plain sync env.py instead of two dialects and an asyncio
    # bridge, with one set of type/param-style quirks to learn.
    # `[binary]` ships prebuilt libpq wheels: no system libpq-dev build step.
    "psycopg[binary]>=3.2",
    # The `asyncio` extra, added in Phase 1 with database/session.py: it is what
    # pulls in greenlet, which `create_async_engine` needs. Plain `sqlalchemy`
    # gets greenlet only via its own platform markers, so on a platform outside
    # that list the async engine would fail at runtime with nothing in the
    # dependency graph explaining why.
    "sqlalchemy[asyncio]>=2.0.36",
]

# Real distribution (unlike the workspace root, which is `package = false`):
# `database` must be importable as a top-level module so Alembic's env.py and
# (from Phase 1) `api` can import it, and so import-linter's `database` root
# package (docs/CODE_QUALITY.md, Phase 1) resolves.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["database"]
