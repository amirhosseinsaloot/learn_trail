# Alembic configuration for the LearnTrail database.
#
# Run it from anywhere in the repo:
#     alembic -c packages/database/alembic.ini current
#     alembic -c packages/database/alembic.ini upgrade head
#
# Phase 0 ships this env with ZERO revisions in migrations/versions/, so
# `heads` is empty and `upgrade head` is a no-op. Phase 1 adds the first
# revision along with the `chat` and `message` tables (docs/SPEC.md §17).

[alembic]
# %(here)s = the directory holding this file, so every path below is
# independent of the caller's working directory.
script_location = %(here)s/migrations

# Timestamp-prefixed filenames: `versions/` sorts chronologically in an editor
# and in code review, which the bare revision hash does not.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# NOTE: no `sqlalchemy.url` key here, on purpose. The URL comes from
# DATABASE_URL via database.config.database_url() inside env.py, so there is
# exactly one place it is resolved and no credential can be committed to an
# .ini file.

# Migrations are authored in UTC; naive local timestamps in filenames are
# ambiguous across machines.
timezone = UTC

# --------------------------------------------------------------------------
# Post-write hooks: every generated revision comes out already satisfying this
# repo's Ruff config (fixes quote style, and drops the template's
# `import sqlalchemy as sa` when the revision does not use it) instead of
# needing a hand-fix pass after each `alembic revision`.
#
# The executable is the repo venv's Ruff by explicit path, not a bare `ruff`:
# `.venv/bin/alembic` does not put `.venv/bin` on PATH, so a bare name would
# make revision generation fail depending on how alembic was invoked. `%(here)s`
# is this file's directory, so the path holds from any working directory.
# --------------------------------------------------------------------------
[post_write_hooks]
hooks = ruff_check, ruff_format

ruff_check.type = exec
ruff_check.executable = %(here)s/../../.venv/bin/ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

ruff_format.type = exec
ruff_format.executable = %(here)s/../../.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# --------------------------------------------------------------------------
# Logging — consumed by logging.config.fileConfig() in env.py.
# --------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
