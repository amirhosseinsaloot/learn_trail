# pnpm workspace root. One node_modules store and one lockfile for the whole
# monorepo, mirroring the single-root convention already used by uv (uv.lock),
# pytest (root pytest.ini) and Ruff/mypy (root pyproject.toml).
#
# Repo-wide tooling (Biome and lefthook) installs at this root with
# `pnpm add -D -w`, exactly as docs/CODE_QUALITY.md's Tier 1 install column
# specifies. Application dependencies (Next, React, TypeScript, ESLint) stay in
# apps/web.
packages:
  - apps/web

# Install scripts are denied unless listed here. sharp only builds/downloads
# native binaries for Next's optional image optimisation, which nothing in this
# app uses yet; Next falls back to the built-in optimiser without it.
#
# lefthook is allowed because its postinstall is what wires `.git/hooks/*` on a
# fresh clone (it runs `lefthook install -f`). Note what it is NOT: lefthook 2.x
# ships its Go binary as a per-platform *optional dependency*
# (`lefthook-linux-x64`), so `node_modules/.bin/lefthook` works even with the
# script blocked — only the automatic hook installation is lost. The script is
# a no-op under `CI=true` and swallows failures, so installing where there is no
# `.git` (a Docker build context, say) still succeeds. `make hooks` performs the
# same installation by hand whenever builds were skipped.
allowBuilds:
  lefthook: true
  sharp: false
