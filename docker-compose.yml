# LearnTrail local development stack (docs/SPEC.md §6).
#
# PHASE 0 DEFINES EXACTLY THREE SERVICES: postgres, backend, frontend.
#
# SPEC §6 lists five services plus an optional local model runtime; that is the
# END STATE, not this phase. CLAUDE.md invariant #6 ("one new AI concept per
# phase") means a service joins this file in the phase that introduces its
# concept:
#
#   LiteLLM Proxy .................. Phase 1
#   Phoenix + OTel collector ....... Phase 5
#   Local model runtime (optional).. Phase 11
#
# Adding any of them early is a phase violation, not a head start. Nothing else
# belongs here either — no pgAdmin, no redis.
#
# Every service defines a real healthcheck. That is the Phase 0 exit criterion
# (plans/phase-0.md) and is asserted by tests/phases/test_phase_0.py, so a
# service without one fails the phase.
#
# There is no `.env` file and no secret anywhere in this stack. The Postgres
# password is the throwaway literal `learntrail`, fixed by
# packages/database/database/config.py, and it is written inline below so the
# whole stack starts from a clean clone with no setup step. (The first real
# .env arrives in Phase 1 alongside gitleaks — docs/CODE_QUALITY.md.)

name: learntrail

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — the one stateful service.
  #
  # Contract fixed by packages/database/database/config.py: role `learntrail`,
  # password `learntrail`, database `learntrail`, 5432 published on host 5432.
  # The host publication is what lets Alembic and pytest run straight from the
  # repo venv against this container.
  #
  # CLAUDE.md invariant #1: no auth, no users. There is deliberately no init SQL
  # here — no `user` table, no seed identities, nothing. Schema arrives only
  # through Alembic revisions, starting in Phase 1.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: learntrail
      POSTGRES_PASSWORD: learntrail
      POSTGRES_DB: learntrail
      # Deterministic collation, so index ordering does not depend on whatever
      # locale the base image happens to default to.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      # Mount point is /var/lib/postgresql, NOT the /var/lib/postgresql/data
      # that every pre-18 example uses. From Postgres 18 the official image
      # stores the cluster in a major-version subdirectory
      # (/var/lib/postgresql/18/docker) so `pg_upgrade --link` can work across
      # versions without crossing a mount boundary; a volume on .../data makes
      # the entrypoint abort at startup with "there appears to be PostgreSQL
      # data in /var/lib/postgresql/data (unused mount/volume)".
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 is load-bearing: the entrypoint runs a TEMPORARY server
      # during first-boot initialisation that listens on the unix socket only.
      # A socket-based pg_isready would report "ready" against that temp server
      # and let the backend connect mid-initdb. Forcing TCP means this only
      # passes once the real server is accepting network connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U learntrail -d learntrail"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backend — FastAPI on uvicorn (apps/api), with packages/database alongside.
  # ---------------------------------------------------------------------------
  backend:
    build:
      # Repo root, not apps/api: the uv workspace root (pyproject.toml,
      # uv.lock) and both member manifests must be in the context.
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      # `postgres` is the compose service name, NOT localhost — inside the
      # network that is how the DB is addressed.
      #
      # `+psycopg` is load-bearing: it selects psycopg 3, which is what
      # packages/database depends on. A bare `postgresql://` URL resolves to
      # psycopg2, which is deliberately NOT a dependency, and blows up at
      # import time. Do not "simplify" this scheme.
      DATABASE_URL: postgresql+psycopg://learntrail:learntrail@postgres:5432/learntrail
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    volumes:
      # Source bind-mounts for --reload. Both are mounted at the paths uv's
      # editable installs point at; the venv lives at /opt/venv, outside /app,
      # precisely so these mounts cannot shadow it.
      - ./apps/api:/app/apps/api
      - ./packages/database:/app/packages/database
    depends_on:
      postgres:
        # Genuine dependency, even though Phase 0 opens no connection at
        # startup (no routes, no engine): `alembic upgrade head` and every
        # Phase 1 request path run from this container, and starting before
        # initdb finishes is exactly the race pg_isready above guards.
        condition: service_healthy
    healthcheck:
      # FastAPI's built-in schema route. apps/api exposes no application
      # routes in Phase 0 by design, and plans/phase-0.md explicitly rules out
      # adding a /health endpoint to make this easier — routes are Phase 1.
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen('http://127.0.0.1:8000/openapi.json', timeout=4).read()
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend — Next.js dev server (apps/web).
  #
  # No depends_on. In Phase 0 the page is static and nothing on it calls the
  # backend, so coupling the two would only make the frontend un-startable
  # whenever the API is down, for no benefit. The dependency lands in Phase 1
  # with the first fetch.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      # Repo root, not apps/web: package.json, pnpm-workspace.yaml,
      # pnpm-lock.yaml and biome.jsonc all live here and
      # `pnpm install --frozen-lockfile` needs them.
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # Poll for file changes: inotify events do not cross a Docker bind mount
      # reliably on every host (notably Windows/macOS), and a dev server that
      # silently stops hot-reloading is worse than a little polling CPU.
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      # Source only. node_modules and .next are ANONYMOUS VOLUMES layered on
      # top: pnpm's node_modules is a symlink farm into a store built inside
      # the image, and bind-mounting the host's over it (or letting the host's
      # shadow it) breaks every resolution. .next gets the same treatment so
      # the container's build output never collides with a host `next dev`.
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    healthcheck:
      # GET / -> 200. Node's global fetch, so no curl in the image.
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))
      # `next dev` compiles the route lazily, on the first request — which is
      # this probe. The long start_period covers that first cold compile.
      interval: 10s
      timeout: 20s
      start_period: 90s
      retries: 10
    restart: unless-stopped

volumes:
  # Named, so `docker compose down` (without -v) keeps the database and
  # `docker compose down -v` is the explicit "throw the data away" gesture.
  postgres_data:
