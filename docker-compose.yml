# LearnTrail local development stack (docs/SPEC.md §6).
#
# AS OF PHASE 5 THIS FILE DEFINES FIVE SERVICES:
#   postgres, backend, frontend (Phase 0) + litellm (Phase 1) + phoenix (Phase 5).
#
# That is SPEC §6's list in full, minus the optional local model runtime.
# CLAUDE.md invariant #6 ("one new AI concept per phase") means a service joins
# this file in the phase that introduces its concept:
#
#   LiteLLM Proxy .................. Phase 1  <- present
#   Phoenix ........................ Phase 5  <- present
#   Local model runtime (optional).. Phase 11
#
# There is deliberately NO standalone OTel collector, though plans/phase-5.md
# named one. See docs/decisions/0002-no-otel-collector.md: Phoenix speaks OTLP
# natively, and vendor-neutrality is a property of instrumenting with the OTel
# SDK rather than of running a forwarder. A collector earns its place when there
# is a second backend to fan out to.
#
# Adding one early is a phase violation, not a head start. Nothing else belongs
# here either — no pgAdmin, no redis.
#
# Every service defines a real healthcheck. That is the Phase 0 exit criterion
# (plans/phase-0.md) and tests/phases/test_phase_0.py asserts the service list
# by SET EQUALITY — so adding a service here means widening PHASE_0_SERVICES in
# that test in the same commit, or Phase 0 flips to FAIL.
#
# The only secret in this stack is the model-provider credential, which lives in
# a gitignored `.env` and is read by the `litellm` service alone (CLAUDE.md
# invariant #3). The Postgres password is NOT a secret: it is the throwaway
# literal `learntrail`, fixed by packages/database/database/config.py, written
# inline below so the stack starts from a clean clone with no setup step.

name: learntrail

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — the one stateful service.
  #
  # Contract fixed by packages/database/database/config.py: role `learntrail`,
  # password `learntrail`, database `learntrail`, 5432 published on host 5432.
  # The host publication is what lets Alembic and pytest run straight from the
  # repo venv against this container.
  #
  # CLAUDE.md invariant #1: no auth, no users. There is deliberately no init SQL
  # here — no `user` table, no seed identities, nothing. Schema arrives only
  # through Alembic revisions, starting in Phase 1.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: learntrail
      POSTGRES_PASSWORD: learntrail
      POSTGRES_DB: learntrail
      # Deterministic collation, so index ordering does not depend on whatever
      # locale the base image happens to default to.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      # Mount point is /var/lib/postgresql, NOT the /var/lib/postgresql/data
      # that every pre-18 example uses. From Postgres 18 the official image
      # stores the cluster in a major-version subdirectory
      # (/var/lib/postgresql/18/docker) so `pg_upgrade --link` can work across
      # versions without crossing a mount boundary; a volume on .../data makes
      # the entrypoint abort at startup with "there appears to be PostgreSQL
      # data in /var/lib/postgresql/data (unused mount/volume)".
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 is load-bearing: the entrypoint runs a TEMPORARY server
      # during first-boot initialisation that listens on the unix socket only.
      # A socket-based pg_isready would report "ready" against that temp server
      # and let the backend connect mid-initdb. Forcing TCP means this only
      # passes once the real server is accepting network connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U learntrail -d learntrail"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backend — FastAPI on uvicorn (apps/api), with packages/database alongside.
  # ---------------------------------------------------------------------------
  backend:
    build:
      # Repo root, not apps/api: the uv workspace root (pyproject.toml,
      # uv.lock) and both member manifests must be in the context.
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      # `postgres` is the compose service name, NOT localhost — inside the
      # network that is how the DB is addressed.
      #
      # `+psycopg` is load-bearing: it selects psycopg 3, which is what
      # packages/database depends on. A bare `postgresql://` URL resolves to
      # psycopg2, which is deliberately NOT a dependency, and blows up at
      # import time. Do not "simplify" this scheme.
      DATABASE_URL: postgresql+psycopg://learntrail:learntrail@postgres:5432/learntrail
      # The gateway's in-network address. The backend asks LiteLLM for an ALIAS
      # and never holds a provider credential (CLAUDE.md invariants #2 and #3) —
      # note there is still no OPENAI_API_KEY in this block, and `printenv`
      # inside the container is the check.
      LITELLM_BASE_URL: http://litellm:4000
      # The key the backend presents *to the proxy*. Not a provider credential:
      # it buys access to the gateway, not to OpenAI, and it is worthless outside
      # this network. Phase 10 replaces it with per-caller virtual keys when
      # routing and budgets arrive.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev-change-me}
      # Standard OTel variables, not Phoenix-specific ones. Everything the app
      # reads is vendor-neutral, so pointing this at Jaeger, Langfuse or an
      # actual collector is a one-line change here and nothing in Python.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006
      OTEL_SERVICE_NAME: learntrail-api
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    volumes:
      # Source bind-mounts for --reload. Both are mounted at the paths uv's
      # editable installs point at; the venv lives at /opt/venv, outside /app,
      # precisely so these mounts cannot shadow it.
      - ./apps/api:/app/apps/api
      - ./packages/ai_core:/app/packages/ai_core
      - ./packages/database:/app/packages/database
      # Prompt versions, mounted so editing one is visible without a rebuild —
      # the same affordance the source mounts give. Read-only: a prompt version
      # is immutable content, and the container has no business writing to it.
      - ./prompts:/app/prompts:ro
    depends_on:
      postgres:
        # Genuine dependency, even though Phase 0 opens no connection at
        # startup (no routes, no engine): `alembic upgrade head` and every
        # Phase 1 request path run from this container, and starting before
        # initdb finishes is exactly the race pg_isready above guards.
        condition: service_healthy
      phoenix:
        # `service_started`, NOT `service_healthy`. Tracing must never be able to
        # stop the product: the exporter drops spans when the collector is
        # unreachable and the request still succeeds, so waiting for Phoenix to
        # be healthy would buy nothing and would make an observability outage
        # into an application outage.
        condition: service_started
    healthcheck:
      # FastAPI's built-in schema route. apps/api exposes no application
      # routes in Phase 0 by design, and plans/phase-0.md explicitly rules out
      # adding a /health endpoint to make this easier — routes are Phase 1.
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen('http://127.0.0.1:8000/openapi.json', timeout=4).read()
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend — Next.js dev server (apps/web).
  #
  # No depends_on. In Phase 0 the page is static and nothing on it calls the
  # backend, so coupling the two would only make the frontend un-startable
  # whenever the API is down, for no benefit. The dependency lands in Phase 1
  # with the first fetch.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      # Repo root, not apps/web: package.json, pnpm-workspace.yaml,
      # pnpm-lock.yaml and biome.jsonc all live here and
      # `pnpm install --frozen-lockfile` needs them.
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # Where the *browser* reaches Phoenix, so a message can link to its trace.
      # `localhost`, not the compose service name: this value is baked into the
      # page and resolved by the user's browser, which is not on this network.
      # A URL, not a credential — nothing here weakens CLAUDE.md invariant #3.
      NEXT_PUBLIC_PHOENIX_URL: http://localhost:6006
      # Poll for file changes: inotify events do not cross a Docker bind mount
      # reliably on every host (notably Windows/macOS), and a dev server that
      # silently stops hot-reloading is worse than a little polling CPU.
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      # Source only. node_modules and .next are ANONYMOUS VOLUMES layered on
      # top: pnpm's node_modules is a symlink farm into a store built inside
      # the image, and bind-mounting the host's over it (or letting the host's
      # shadow it) breaks every resolution. .next gets the same treatment so
      # the container's build output never collides with a host `next dev`.
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    healthcheck:
      # GET / -> 200. Node's global fetch, so no curl in the image.
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))
      # `next dev` compiles the route lazily, on the first request — which is
      # this probe. The long start_period covers that first cold compile.
      interval: 10s
      timeout: 20s
      start_period: 90s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # LiteLLM Proxy — the model gateway (Phase 1, docs/SPEC.md §7).
  #
  # Joins in this phase because this is the phase that introduces the concept of
  # calling a model at all. It is the ONLY service holding a provider
  # credential, and the only one that talks to a provider (CLAUDE.md invariant
  # #3). Aliases live in infra/litellm/config.yaml, not here — invariant #2.
  #
  # Published on LOOPBACK ONLY — `127.0.0.1:4000`, not `4000`. The difference is
  # the point: the short form binds 0.0.0.0 and exposes a money-spending endpoint
  # to every host on the network, which for a local dev stack is a real hazard.
  #
  # It is published at all (an earlier revision published nothing) so the live
  # gateway test in packages/ai_core/tests can actually run. A test that can never
  # execute is worse than no test: it looks like coverage and asserts nothing.
  # The backend still reaches the gateway in-network at `http://litellm:4000`.
  # ---------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:v1.80.5-stable
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      # `required: false` is load-bearing: without it, compose refuses to start
      # ANY service when .env is absent, so a clean clone could not run the
      # Phase 0 stack. With it, the gateway starts credential-less and fails
      # only when something actually calls a model — which is the correct blast
      # radius for a missing key.
      - path: .env
        required: false
    environment:
      # A default so the container starts on a clean clone. This guards the
      # proxy's own management routes, not a provider; a real value belongs in
      # .env. It is deliberately obvious rather than plausible.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev-change-me}
    volumes:
      # Read-only: the gateway must never rewrite its own alias definitions.
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      # /health/liveliness, NOT /health. The latter actively pings every
      # configured provider, so it fails without a real API key — which would
      # make the whole stack un-startable until a credential exists, and would
      # spend money on every probe. Liveliness answers "the proxy is up and its
      # config parsed", which is what a healthcheck should mean.
      #
      # Python is in this image; curl is not guaranteed to be.
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=4).read()
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Phoenix — the trace backend (Phase 5, docs/SPEC.md §11).
  #
  # Joins in this phase because this is the phase that introduces tracing. It
  # receives OTLP over HTTP on 6006, the same port that serves its UI.
  #
  # It holds no credential and calls no provider: spans arrive from the backend
  # and stop here. What it *does* hold is prompts and answers, which is why
  # SPEC §11 says not to put secrets in traces — the safety pipeline's PII
  # findings are recorded as categories, never values, for exactly this reason.
  #
  # Storage is its own volume (SQLite, Phoenix's default) rather than the app's
  # Postgres. Sharing the database would mean Phoenix creating and migrating its
  # own tables inside ours, which the Alembic autogenerate filter would then have
  # to keep ignoring forever. Traces are not application data.
  # ---------------------------------------------------------------------------
  phoenix:
    image: arizephoenix/phoenix:version-19.9.0
    ports:
      # UI and OTLP/HTTP on one port. Bound to loopback like the gateway: a
      # trace store holds every question asked and every answer given, which is
      # not something to expose to the local network by accident.
      - "127.0.0.1:6006:6006"
    environment:
      # Where Phoenix keeps its SQLite database inside the container; the volume
      # below is mounted at exactly this path.
      PHOENIX_WORKING_DIR: /phoenix
    volumes:
      - phoenix_data:/phoenix
    healthcheck:
      # Phoenix's own readiness route. `python` is in this image; curl is not
      # guaranteed to be — the same reasoning as the litellm probe above.
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen('http://127.0.0.1:6006/healthz', timeout=4).read()
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    restart: unless-stopped

volumes:
  # Named, so `docker compose down` (without -v) keeps the database and
  # `docker compose down -v` is the explicit "throw the data away" gesture.
  postgres_data:
  # Traces get the same treatment, and for the same reason: they are the record
  # of what the system did, and losing them on a routine `down` would make the
  # observability backend useless the moment you most want it.
  phoenix_data:
