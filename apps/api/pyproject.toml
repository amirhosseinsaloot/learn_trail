[project]
name = "learntrail-api"
version = "0.1.0"
description = "LearnTrail HTTP API (FastAPI). Top layer of docs/SPEC.md §16."
readme = "../../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.2",
    # api -> ai_core -> database. The API never imports a provider SDK; it asks
    # ai_core for an alias (CLAUDE.md invariant #2).
    "learntrail-ai-core",
    # The dependency direction of docs/ARCHITECTURE.md §7, made real:
    # api -> database, never the reverse. `database` imports nothing from `api`.
    # Phase 1's import-linter contracts will enforce this rather than trusting it.
    "learntrail-database",
    # Traces the HTTP layer — the `chat.request` span every graph span hangs
    # under (docs/SPEC.md §11's trace shape). Auto-instrumentation rather than a
    # hand-written middleware: the ASGI details it gets right (status codes on
    # streaming responses, exception recording) are not worth reimplementing.
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "pydantic>=2.12.4",
    "uvicorn[standard]>=0.40.0",
]

# Real distribution (unlike the workspace root, which is `package = false`):
# the `api` package must be importable as a top-level module so that
# `uvicorn api.main:app` works, and so import-linter's `api` root package
# (docs/CODE_QUALITY.md, Phase 1) resolves.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]
