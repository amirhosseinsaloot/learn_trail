[project]
name = "learntrail-api"
version = "0.1.0"
description = "LearnTrail HTTP API (FastAPI). Top layer of docs/SPEC.md §16."
readme = "../../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.2",
    "pydantic>=2.12.4",
    "uvicorn[standard]>=0.40.0",
]

# Real distribution (unlike the workspace root, which is `package = false`):
# the `api` package must be importable as a top-level module so that
# `uvicorn api.main:app` works, and so import-linter's `api` root package
# (docs/CODE_QUALITY.md, Phase 1) resolves.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]
