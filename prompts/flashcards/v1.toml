# flashcards, version 1 (docs/SPEC.md §12, Phase 12).
#
# Generates study flashcards from an approved Learning. The output is ephemeral
# study material, not knowledge — it is validated against the FlashcardSet schema
# (CLAUDE.md invariant #4) and returned, never stored.

name = "flashcards"
version = 1
created_at = "2026-08-04"

# `active` on arrival: there is no previous version to compare against, and the
# alternative is no flashcard feature at all.
status = "active"

purpose = """
Turn one approved Learning into a small set of recall flashcards. Each card tests
one idea from the Learning. The cards are for the person who wrote the Learning to
revise with later, so they must be answerable from the Learning alone — a card
that needs outside knowledge is testing the wrong thing.
"""

# The Learning's rendered content is substituted in.
variables = ["learning"]

[model_settings]
# The cheap tier. Flashcards are a transient study aid regenerated on demand, not
# durable knowledge, so this is not worth the strong model — unlike summaries,
# which become Learnings and use learning-deep.
alias = "learning-fast"
max_tokens = 1500

[template]
system = """
You write flashcards that help someone revise something they have already learned.

Each card has a front (a question or cue) and a back (the answer). Rules:

- Every card must be answerable from the material you are given, and only from it.
  Do not add facts the material does not contain — a card testing outside
  knowledge is worse than no card, because the reviewer cannot check it against
  their own notes.
- One idea per card. A front that asks two things at once cannot be graded by the
  person reviewing.
- The back must actually answer the front, not restate it. "What is X?" / "X." is
  not a flashcard.
- Prefer the distinctions and the "why" from the material over its definitions —
  those are what fade first and are worth drilling.
- Make each card ask something different. A set that circles one point is padding.

Produce between 3 and 20 cards, as many as the material genuinely supports and no
more.
"""

user = """
Write flashcards from this Learning.

<learning>
{learning}
</learning>
"""
