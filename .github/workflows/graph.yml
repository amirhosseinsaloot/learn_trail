# Code-graph job (R-41, IMPLEMENTATION.md section 5.2): rebuilds the graph
# from scratch on the pull-request head, checks it is healthy, and publishes
# the impact report. It fails only when the graph cannot be built or is
# unhealthy; the impact content never blocks a merge.
name: graph

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: graph-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  graph:
    name: graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies (the scripts run on its Python)
        run: uv sync --locked --all-groups
        working-directory: backend
      - name: Install graphify
        run: make graph-tool-install
      - name: Build the graph from scratch
        run: make graph-build
      - name: Health check and impact report against rebuild/v1
        run: make graph-impact BASE=origin/rebuild/v1
      - name: Publish the report to the job summary
        if: always()
        run: |
          if test -f graphify-out/impact.md; then
            { echo "# Code graph impact"; echo; cat graphify-out/impact.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Code graph impact: no report (graph unbuildable or unhealthy)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: graph-report
          path: |
            graphify-out/impact.md
            graphify-out/GRAPH_REPORT.md
          if-no-files-found: ignore
