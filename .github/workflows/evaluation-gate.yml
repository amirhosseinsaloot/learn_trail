# Phase 6's exit criterion, as a pull-request check.
#
#     "Prompt or model changes cannot be merged without running the evaluation
#      suite."
#
# THE ONE DESIGN DECISION IN THIS FILE. There is no `paths:` filter on the
# trigger, and that is deliberate rather than an oversight. A required check with
# a path filter never runs on a PR that misses the filter, and a required check
# that never runs blocks the PR forever — the classic GitHub deadlock. So the job
# always runs and decides *internally* whether the change needs evaluating,
# passing immediately when it does not. Cheap either way: the decision is a
# string comparison over changed paths.
#
# WHAT THIS FILE CANNOT DO. A workflow can fail a check; only branch protection
# can make that check required. Until `evaluation-gate` is marked required on the
# default branch, this reports and does not block — and Phase 6's criterion is
# only half true. The one manual step is recorded in plans/phase-6.md and
# docs/STATE.md rather than quietly assumed.
#
# WHY THIS JOB CALLS NO MODEL. It checks that a passing run was *recorded* for
# the current prompt/model configuration, not that one happens now. Running the
# suite here would need a provider credential in CI and would spend money on
# every push. The developer runs `make evals` locally, which records the manifest;
# this verifies the manifest matches what is being merged. The fingerprint is what
# makes that verification honest — a stale manifest cannot pass for a fresh one.

name: evaluation-gate

on:
  pull_request:
  # So the default branch's own state is visible, not only PRs into it.
  push:
    branches: [main, master]
  workflow_dispatch:

# A second push to the same PR makes the first check irrelevant.
concurrency:
  group: evaluation-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: evaluation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The gate compares against the merge base, so it needs history. `0` is
          # blunt but this repo is small, and a shallow clone that silently
          # reported "no files changed" would pass every PR.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Without the `judges` extra: this job never runs the suite, and installing
      # DeepEval to read a JSON manifest would add a minute to every PR.
      - name: Install
        run: uv sync --all-groups

      - name: Which files changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # `|| true` on the first push to a branch, where `before` is all zeros
          # and the diff fails. An empty list means "no prompt/model change",
          # which the gate below then reports rather than crashing on.
          {
            echo "files<<EOF"
            git diff --name-only "$base" "$head" 2>/dev/null || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check the evaluation gate
        run: |
          uv run python -m evals gate --changed "${{ steps.changed.outputs.files }}"

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error::A prompt or model file changed and no passing evaluation run"
          echo "::error::covers the current configuration. Run 'make evals' locally and"
          echo "::error::commit packages/evals/reports/last_run.json."
