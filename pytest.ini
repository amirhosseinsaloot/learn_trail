[pytest]
markers =
    phase: executable exit-criterion check for one roadmap phase (see docs/SPEC.md, plans/).
    slow: test that is too slow for the FAST lane; excluded from `make test`.

# One pytest config for the whole repo — no apps/api/pytest.ini, no
# packages/*/pytest.ini, no per-package [tool.pytest.ini_options], no tox.ini.
# `pytest` from the root runs every Python test in the monorepo, and rootdir,
# markers and import semantics are identical wherever a test lives.
#
# Roots, not leaf `tests/` directories, on purpose: a workspace member's tests
# are discovered the day someone writes them. Listing leaves
# (`apps/api/tests packages/database/tests`) would mean a member whose tests
# directory nobody remembered to add here contributes zero tests while pytest
# still exits 0 — a silent green. `norecursedirs` already prunes `node_modules`
# and dot-directories, so pointing at `apps` costs nothing for apps/web.
#
# `norecursedirs` is left unset on purpose. pytest's default already contains
# `node_modules`, `dist`, `build` and `.*`, and setting the key *replaces* that
# list rather than extending it — so anything added here later must re-list
# `node_modules`, or pytest starts walking apps/web's dependency tree.
testpaths = tests apps packages

# Import mode `importlib`, set through addopts because there is no `importmode`
# ini key: pytest 9.1.1 exposes import mode only as the `--import-mode` command
# line option. Writing `importmode = importlib` above would be accepted with a
# `PytestConfigWarning: Unknown config option` and silently do nothing.
#
# Why it is needed: with discovery spanning three trees, the default `prepend`
# mode imports apps/api/tests/test_config.py as top-level module `test_config`
# (no `__init__.py` marks a package root, so the test's own directory goes on
# sys.path), then refuses packages/database/tests/test_config.py with "import
# file mismatch". Adding `__init__.py` files does not help — both files would
# then want the name `tests.test_config`. `importlib` derives a unique
# rootdir-relative name instead (`apps.api.tests.test_config` vs
# `packages.database.tests.test_config`) and never mutates sys.path, so
# same-named test modules coexist and test directories stay plain directories.
#
# `consider_namespace_packages = true` is the usual companion advice and is
# deliberately NOT set: checked against 9.1.1, it changes nothing here, because
# importlib mode alone already yields the unique dotted names above and already
# resolves intra-directory relative imports. Revisit only if a genuine namespace
# package appears.
#
# `--strict-markers`: an unregistered marker is an error, not a warning. Without
# it a typo like `@pytest.mark.phse` would silently opt that test *into*
# `make test` (which deselects `phase`), turning the pre-push gate permanently
# red — the exact failure the `not phase` deselection exists to prevent.
addopts = --import-mode=importlib --strict-markers
