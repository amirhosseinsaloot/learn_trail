# LiteLLM Proxy — the single boundary between LearnTrail and any model provider.
#
# CLAUDE.md invariant #2: application code requests an ALIAS (`learning-fast`,
# `learning-deep`, `safety-judge`) and never a provider/model string. That is
# what makes this file the only place a provider decision lives — swapping
# Anthropic for OpenAI, or a cloud model for a local one in Phase 11, is an edit
# here and nowhere else.
#
# CLAUDE.md invariant #3: the credential is read from the environment on the
# server side. It is never baked into this file, never returned by an endpoint,
# and never reaches the frontend. `os.environ/NAME` is LiteLLM's indirection for
# "read this at startup" — the literal string is what is committed.
#
# Phase 1 wires exactly ONE cloud provider. Fallbacks, routing strategies, cost
# budgets and local models are later phases (10 and 11) — see invariant #6.

model_list:
  # ---------------------------------------------------------------------------
  # learning-fast — the default for chat answers.
  #
  # Haiku 4.5: cheapest and fastest current Claude model ($1/$5 per Mtok).
  # 200K context, which is ample for a single conversation's working context
  # (docs/ARCHITECTURE.md §6) — the whole point of `build_context` is that the
  # full history is not sent.
  # ---------------------------------------------------------------------------
  - model_name: learning-fast
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # ---------------------------------------------------------------------------
  # learning-deep — reserved for work that must be right rather than quick:
  # structured summary generation (Phase 3) and anything a Learning is derived
  # from. Not used by the Phase 1 chat path.
  #
  # Opus 5 ($5/$25 per Mtok, 1M context). Thinking is on by default on this
  # model, so a `max_tokens` sized for the answer alone will truncate — the
  # ceiling below covers thinking plus response.
  # ---------------------------------------------------------------------------
  - model_name: learning-deep
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 16000

  # ---------------------------------------------------------------------------
  # safety-judge — the LLM-as-judge alias for the Phase 4 safety pipeline and
  # the Phase 6 evaluation suite. Declared now because the alias *contract* is
  # what invariant #2 is about; nothing calls it until Phase 4.
  #
  # Deliberately a cheap model: a judge runs on every request in the phases that
  # use it, so its cost multiplies. Judging is a classification task, which is
  # what Haiku is for.
  # ---------------------------------------------------------------------------
  - model_name: safety-judge
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  # Reject a request that names a parameter the target provider does not accept,
  # rather than silently discarding it. `drop_params: true` is the common
  # default and it hides real bugs — a `temperature` silently dropped on a model
  # that rejects it looks like the setting had no effect. Invariant #4's spirit
  # is that bad input fails loudly.
  drop_params: false
  # Never log prompt or completion bodies. Conversations are the user's learning
  # material, and Phase 5 is where observability is designed deliberately.
  turn_off_message_logging: true

general_settings:
  # Admin/proxy auth, not a provider credential: this is the key a caller
  # presents to LiteLLM itself. Required for the proxy's management routes.
  master_key: os.environ/LITELLM_MASTER_KEY
