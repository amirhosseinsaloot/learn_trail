# LiteLLM Proxy — the single boundary between LearnTrail and any model provider.
#
# CLAUDE.md invariant #2: application code requests an ALIAS (`learning-fast`,
# `learning-deep`, `safety-judge`) and never a provider/model string. This file is
# the proof that the invariant is worth having — switching the whole application
# from Anthropic to OpenAI was an edit to this file and two lines of prose in
# docs/STATE.md. No application code, no schema, no test changed.
#
# CLAUDE.md invariant #3: the credential is read from the environment on the
# server side. It is never baked into this file, never returned by an endpoint,
# and never reaches the frontend. `os.environ/NAME` is LiteLLM's indirection for
# "read this at startup" — the literal string is what is committed.
#
# Phase 1 wires exactly ONE provider. Fallbacks, routing strategies, cost budgets
# and local models are later phases (10 and 11) — see invariant #6.
#
# ---------------------------------------------------------------------------
# CHANGING MODELS
#
# Each alias below names a model on one line. To move an alias to a different
# model, edit that line. To move the whole application to a different provider,
# edit the `model:` prefix and the `api_key:` variable, then set that variable in
# .env — nothing outside this file and .env needs to know.
#
# The specific model IDs here are a starting point chosen for broad availability,
# not a recommendation: if your account has a newer or cheaper tier, prefer it.
# A wrong ID fails at the first real call (LiteLLM surfaces the provider's 404),
# not at startup — the healthcheck deliberately does not ping providers.
# ---------------------------------------------------------------------------

model_list:
  # ---------------------------------------------------------------------------
  # learning-fast — the default for chat answers.
  #
  # The cheap, quick tier. This alias is on the hot path: every question in every
  # conversation goes through it, so its cost and latency are the ones the user
  # actually feels.
  # ---------------------------------------------------------------------------
  - model_name: learning-fast
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # ---------------------------------------------------------------------------
  # learning-deep — reserved for work that must be right rather than quick:
  # structured summary generation (Phase 3) and anything an approved Learning is
  # derived from. Not used by the Phase 1 chat path.
  # ---------------------------------------------------------------------------
  - model_name: learning-deep
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      # No `max_tokens` here, deliberately — an earlier revision had one and it
      # broke every typed-generation call with a 400.
      #
      # LiteLLM translates a caller's `max_tokens` into whatever the target model
      # expects (`max_completion_tokens` for current OpenAI models). When the
      # alias *also* carries one, the provider receives both spellings of the
      # same parameter and rejects the request outright. Callers already set
      # their own ceiling (`CompletionRequest.max_tokens`, and the prompt file's
      # `model_settings.max_tokens`), which is the right place for it: a ceiling
      # depends on what is being generated, not on which model serves it.
      #
      # An alias answers "which model plays this role". It should not also try to
      # answer "how long may the answer be".

  # ---------------------------------------------------------------------------
  # safety-judge — the LLM-as-judge alias for the Phase 4 safety pipeline and the
  # Phase 6 evaluation suite. Declared now because the alias *contract* is what
  # invariant #2 is about; nothing calls it until Phase 4.
  #
  # Deliberately the cheap tier: a judge runs on every request in the phases that
  # use it, so its cost multiplies by traffic. Judging is a classification task.
  # ---------------------------------------------------------------------------
  - model_name: safety-judge
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # ---------------------------------------------------------------------------
  # learning-embedding — vectors for semantic search over approved Learnings
  # (Phase 8). An alias like any other: nothing in the application names
  # `text-embedding-3-small`, so swapping to a local model in Phase 11 is an edit
  # to this block alone (CLAUDE.md invariant #2).
  #
  # `text-embedding-3-small` at 1536 dimensions. The `-large` model scores better
  # on retrieval benchmarks and costs 6.5x more per token for vectors that are
  # twice as wide — which doubles the index size and the memory every query
  # touches. For a personal library that will hold hundreds of Learnings rather
  # than millions, that is a poor trade.
  #
  # **Changing this alias is a breaking change, not a tuning knob.** Embeddings
  # from two different models are not comparable: a library indexed with one and
  # queried with another returns confident nonsense, because the vectors occupy
  # different spaces. `learning_chunk.embedding_model` records which model
  # produced each row so a mismatch is detectable, and re-indexing is the only
  # correct response to changing it.
  # ---------------------------------------------------------------------------
  - model_name: learning-embedding
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

  # ---------------------------------------------------------------------------
  # learning-local — a model served on this machine (Phase 11, docs/SPEC.md §15).
  #
  # This is the alias that makes "answer without an outbound call to a cloud
  # provider" possible. It points at an OpenAI-compatible endpoint that is NOT a
  # cloud host: Ollama, either the `ollama` compose service (the default below)
  # or an Ollama running on the host — set OLLAMA_BASE_URL to
  # http://host.docker.internal:11434/v1 for the latter, which is the path the
  # Phase 11 benchmark uses.
  #
  # The api_key is the literal "ollama": Ollama ignores it, but the OpenAI SDK
  # LiteLLM uses refuses to send a request with no key at all. It is not a
  # credential and buys access to nothing — which is the point of a local model.
  #
  # model: openai/llama3.2:1b — small enough to run on a laptop GPU or CPU. The
  # `openai/` prefix is LiteLLM's "this endpoint speaks the OpenAI wire format",
  # not a statement that OpenAI serves it.
  # ---------------------------------------------------------------------------
  - model_name: learning-local
    litellm_params:
      model: openai/llama3.2:1b
      api_base: os.environ/OLLAMA_BASE_URL
      api_key: ollama

litellm_settings:
  # Reject a request naming a parameter the target provider does not accept,
  # rather than silently discarding it. `drop_params: true` is the common default
  # and it hides real bugs — a `temperature` silently dropped on a model that
  # rejects it looks like the setting simply had no effect. Invariant #4's spirit
  # is that bad input fails loudly.
  #
  # Worth knowing when swapping in a reasoning-tier model: those reject
  # `temperature` outright. With this set to `false` that surfaces as an error
  # instead of a silent no-op — which is the intent, but it means the failure is
  # yours to fix rather than LiteLLM's to paper over.
  drop_params: false
  # Never log prompt or completion bodies. Conversations are the user's learning
  # material, and Phase 5 is where observability is designed deliberately.
  turn_off_message_logging: true

general_settings:
  # Admin/proxy auth, not a provider credential: this is the key a caller
  # presents to LiteLLM itself. Required for the proxy's management routes.
  master_key: os.environ/LITELLM_MASTER_KEY
