[project]
name = "learntrail"
version = "0.1.0"
description = "Single-user AI learning workspace: persistent Q&A distilled into human-approved Learnings."
readme = "README.md"
requires-python = ">=3.12"
# The root is an aggregator: it depends on the workspace members so that the
# single documented command (`uv sync --all-groups`) installs the whole repo's
# runtime + dev environment. Members declare their own real dependencies.
dependencies = [
    "learntrail-ai-core",
    "learntrail-api",
    "learntrail-database",
    # Without the `judges` extra: DeepEval is only needed to *run* the suite, and
    # the gate that enforces Phase 6's criterion imports none of it. Install it
    # with `uv sync --all-groups --extra judges`, or `make evals` does it for you.
    "learntrail-evals",
]

# Root is an environment/tooling project, not an installable distribution:
# no build backend, nothing to build. Application code lives in apps/ and
# packages/, which get their own pyproject.toml as they land.
[tool.uv]
package = false

# Members are listed explicitly, not globbed: apps/web is a pnpm project, and uv
# errors on a member directory with no pyproject.toml. A package joins this list
# in the phase that introduces it — ai_core arrived in Phase 1 with the gateway
# client, evals in Phase 6 with the evaluation suite.
[tool.uv.workspace]
members = ["apps/api", "packages/ai_core", "packages/database", "packages/evals"]

[tool.uv.sources]
learntrail-ai-core = { workspace = true }
learntrail-api = { workspace = true }
learntrail-database = { workspace = true }
learntrail-evals = { workspace = true }

# Tier 1 Python tooling, plus the Tier 2 additions each phase actually uses
# (docs/CODE_QUALITY.md). Still deferred: respx, testcontainers, pytest-cov,
# import-linter — each lands in the phase that needs it, per CLAUDE.md
# invariant #6.
[dependency-groups]
dev = [
    # anyio ships the pytest plugin that runs `async def` tests. It already
    # arrives transitively via starlette, but the async database and endpoint
    # tests import its marker directly, so it is declared rather than borrowed.
    "anyio>=4.14",
    # Starlette's TestClient and FastAPI's ASGITransport are both httpx-based;
    # without it, importing the test client fails with a RuntimeError telling you
    # to install it. Test-only, hence the dev group.
    "httpx>=0.28",
    "mypy>=2.3,<3",
    "pytest>=9.1",
    "ruff>=0.16,<0.17",
]

# --------------------------------------------------------------------------
# Ruff — the only Python linter AND the only formatter (docs/CODE_QUALITY.md,
# "Decisions and rejections": replaces Black, isort, flake8 and Bandit).
# --------------------------------------------------------------------------
[tool.ruff]
# Refuse to run under a drifting Ruff: rule sets and formatting are not stable
# across minor versions, so pin the same range the dev group locks.
required-version = ">=0.16,<0.17"
target-version = "py312"
line-length = 100
extend-exclude = [
    # Claude Code harness scripts, not application source; they run under the
    # ambient interpreter, outside this project's dependency graph.
    ".claude",
]

[tool.ruff.lint]
# Exactly the docs/CODE_QUALITY.md Tier 1 set — no more, no less.
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes: unused / undefined
    "I",     # isort: import order
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "S",     # flake8-bandit (security)
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "PTH",   # flake8-use-pathlib
    "ASYNC", # flake8-async
    "RUF",   # Ruff-native
]

[tool.ruff.lint.per-file-ignores]
# `assert` is how pytest expresses assertions; S101 is noise in test code only.
"tests/**/*.py" = ["S101"]
"**/tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
# Every top-level package this repo publishes. A member missing from this list is
# sorted as a third-party import, which is how `ai_core` briefly ended up
# interleaved with `openai` and `pydantic` — add new members here when they land.
known-first-party = ["ai_core", "api", "database"]

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------
# mypy — the only type checker (docs/CODE_QUALITY.md, "Decisions and
# rejections": Pyright is rejected; do not add a second checker or any
# Pyright/basedpyright config, including in editor settings).
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
# The Pydantic plugin is the documented reason mypy was chosen over Pyright
# (this codebase is Pydantic-heavy by design — CLAUDE.md invariant #4). mypy has
# no stable plugin API, so a major bump can break it quietly; there is no config
# flag that turns that into a hard error. It is verified by running mypy over a
# BaseModel and confirming init_typed/init_forbid_extra actually bite — done for
# mypy 2.3.0, see plans/phase-0.md. Re-verify on the next mypy major.
plugins = ["pydantic.mypy"]
exclude = [
    '^\.venv/',
    '^\.claude/',
]

# Guardrails AI ships no py.typed marker and no stubs, so mypy sees every symbol
# it exports as `Any` — including `Validator`, which our layer-4 validators must
# subclass. Under `strict` that is two errors (`import-untyped` and
# "cannot subclass Any") for a dependency we do not control.
#
# Scoped to the one module that touches it, rather than relaxed globally: the
# rest of the repo keeps full strictness, and if Guardrails ever ships stubs this
# override is the single thing to delete.
[[tool.mypy.overrides]]
module = ["guardrails.*", "nemoguardrails.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ai_core.safety.summary_validators"]
disallow_subclassing_any = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
